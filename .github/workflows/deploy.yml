name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Um deploy por vez; o que está rodando termina (não deixa migration pela metade).
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: southamerica-east1-docker.pkg.dev/aurora-513810/aurora

jobs:
  deploy:
    name: Build and deploy to GCP
    # A infra existe só no fork pessoal; no repositório oficial este job nunca roda.
    if: github.repository == 'henriquelopeslima/aurora'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          project_id: aurora-513810
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push images
        run: |
          gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
          for target in php nginx; do
            docker build -f docker/prod/Dockerfile --target "$target" -t "$REGISTRY/$target:$GITHUB_SHA" .
            docker push "$REGISTRY/$target:$GITHUB_SHA"
          done

      - name: Deploy to the VM
        run: |
          gcloud compute ssh aurora --zone southamerica-east1-a --tunnel-through-iap --quiet \
            --command "sudo aurora-deploy $GITHUB_SHA"
