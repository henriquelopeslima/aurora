# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    serializer:
        default_context:
            enable_max_depth: true

    assets:
        packages:
            images:
                base_urls: '%env(STORAGE_BASE_URL)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    parameters:
        env(TRUSTED_PROXIES): ''
    framework:
        # Atrás do Cloudflare Tunnel: sem isso URLs absolutas (redirects, link de confirmação
        # por e-mail) sairiam com http://. Valor vem do ambiente (infra/vm/compose.yaml).
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host']
