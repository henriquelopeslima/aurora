# Roteador dos previews: o tunnel não aceita curinga parcial (pr-*-aurora), então todo host fora de prod chega aqui.

server {
    listen 80 default_server;
    return 404;
}

server {
    listen 80;
    server_name ~^pr-(?<pr>[1-9][0-9]*)-aurora\.henriquelopeslima\.dev\.br$;

    # DNS do Docker: resolve pr-<n> na hora, então preview novo não exige reload.
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 40M;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://pr-$pr:80;
        # Alias que não resolve (preview fora do ar) vira 404, não 502.
        error_page 502 = @notfound;
    }

    location @notfound {
        return 404;
    }
}
