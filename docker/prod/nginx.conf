server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Igual ao upload_max_filesize do PHP; o default do nginx (1M) barraria uploads.
    client_max_body_size 40M;

    # A Cloudflare também entrega quem chegou por http://; sem isto o Symfony geraria
    # links http (inclusive no e-mail de confirmação).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    location /uploads/ {
        alias /var/www/assets/uploads/;
    }
}
